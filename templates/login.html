{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="section"><div class="container form-narrow">
  <h2 id="form-title">Sign in</h2>
  <p class="sub">Sign in to save your progress, or create a free account.</p>
  <div class="card">
    <button type="button" class="btn btn-google" id="google-btn" onclick="signInWithGoogle()">
      <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.81.54-1.85.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03l2.97-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.97l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      <span>Continue with Google</span>
    </button>
    <div class="divider"><span>or</span></div>
    <div class="field" id="name-field" style="display:none"><label for="name">Name</label><input id="name" autocomplete="name"></div>
    <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email"></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password"></div>
    <button class="btn btn-primary" id="submit" onclick="submitAuth()">Sign in</button>
    <button class="btn btn-ghost btn-sm" onclick="toggleMode()" style="margin-left:8px">Create an account instead</button>
    <div id="auth-out"></div>
  </div>
</div></section>
{% endblock %}
{% block scripts %}
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="/static/js/firebase-config.js"></script>
<script>
let registerMode = false;
try { firebase.initializeApp(firebaseConfig); } catch (e) { console.warn("Firebase init failed", e); }

function toggleMode() {
  registerMode = !registerMode;
  document.getElementById("name-field").style.display = registerMode ? "" : "none";
  document.getElementById("form-title").textContent = registerMode ? "Create account" : "Sign in";
  document.getElementById("submit").textContent = registerMode ? "Create account" : "Sign in";
  event.target.textContent = registerMode ? "Sign in instead" : "Create an account instead";
}
async function submitAuth() {
  const out = document.getElementById("auth-out");
  try {
    const body = { email: email.value, password: password.value };
    let r;
    if (registerMode) r = await API.post("/auth/register", { ...body, name: document.getElementById("name").value });
    else r = await API.post("/auth/login", body);
    window.location.href = r.role === "admin" ? "/admin" : "/dashboard";
  } catch (e) { notify(out, e.message, false); }
}
async function signInWithGoogle() {
  const out = document.getElementById("auth-out");
  try {
    const provider = new firebase.auth.GoogleAuthProvider();
    const result = await firebase.auth().signInWithPopup(provider);
    const idToken = await result.user.getIdToken();
    const r = await API.post("/auth/google", { id_token: idToken });
    window.location.href = r.role === "admin" ? "/admin" : "/dashboard";
  } catch (e) { notify(out, e.message || "Google sign-in failed", false); }
}
</script>
{% endblock %}
